<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contenedores</title>
<link rel="stylesheet" href="/sidebar.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f6fa;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:10px;
margin-bottom:15px;
}

button{
background:#0c63e7;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0c63e7;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>📦 Gestión de Contenedores</h1>

<div class="card">

<h2>Nuevo Contenedor</h2>

<label>Número</label>
<input type="text" id="numero">

<label>Transporte</label>
<select id="transporte_id">
<option value="">Sin transporte asociado</option>
</select>

<label>Cliente</label>
<select id="cliente_id" required>
<option value="">Cargando clientes...</option>
</select>

<label>Tipo</label>

<select id="tipo">
<option>20 Pies</option>
<option>40 Pies</option>
</select>

<label>Puerto</label>
<input type="text" id="puerto">

<label>Estado</label>
<select id="estado">
<option>Pendiente</option>
<option>Aprobado</option>
<option>En Proceso</option>
<option>Finalizado</option>
</select>

<button onclick="guardarContenedor()">
Guardar Contenedor
</button>

</div>

<div class="card">

<h2>Contenedores Registrados</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Número</th>
<th>Cliente</th>
<th>Tipo</th>
<th>Puerto</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tablaContenedores">

</tbody>

</table>

</div>

<script src="/api.js"></script>
<script>
async function cargarTransportes() {
  const transportes = (await loadRecords("transportes"))
    .filter((transporte) => ["En Proceso", "Finalizado"].includes(transporte.estado));
  const select = document.getElementById("transporte_id");
  select.innerHTML = '<option value="">Sin transporte asociado</option>' +
    transportes.map((transporte) => `
      <option value="${transporte.id}" data-cliente-id="${transporte.cliente_id || ""}">
        #${transporte.id} · ${escapeHtml(transporte.cliente || "Sin cliente")} · ${escapeHtml(transporte.origen)} → ${escapeHtml(transporte.destino)}
      </option>
    `).join("");
  select.addEventListener("change", () => {
    const option = select.options[select.selectedIndex];
    if (option.value) {
      document.getElementById("cliente_id").value = option.dataset.clienteId || "";
    }
  });
}

async function cargarClientes() {
  const clientes = await loadRecords("clientes");
  document.getElementById("cliente_id").innerHTML =
    '<option value="" selected disabled>Seleccione un cliente</option>' +
    clientes.map((cliente) => `<option value="${cliente.id}">${escapeHtml(cliente.nombre)}</option>`).join("");
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

async function mostrarContenedores() {
  const tabla = document.getElementById("tablaContenedores");
  const contenedores = await loadRecords("contenedores");
  tabla.innerHTML = contenedores.map((c) => `
    <tr><td>${c.id}</td><td>${escapeHtml(c.numero)}</td><td>${escapeHtml(c.cliente)}</td><td>${escapeHtml(c.tipo)}</td><td>${escapeHtml(c.puerto)}</td><td>${escapeHtml(c.estado)}</td></tr>
  `).join("");
}

async function guardarContenedor() {
  const record = {
    numero: document.getElementById("numero").value,
    cliente_id: document.getElementById("cliente_id").value,
    transporte_id: document.getElementById("transporte_id").value,
    tipo: document.getElementById("tipo").value,
    puerto: document.getElementById("puerto").value,
    estado: document.getElementById("estado").value
  };
  if (record.numero === "" || record.cliente_id === "") {
    alert("Debe indicar el número y seleccionar un cliente");
    return;
  }
  try {
    await saveRecord("contenedores", record);
    await mostrarContenedores();
    ["numero", "puerto"].forEach((id) => document.getElementById(id).value = "");
    document.getElementById("cliente_id").value = "";
    document.getElementById("transporte_id").value = "";
  } catch (error) {
    showApiError(error);
  }
}

Promise.all([cargarClientes(), cargarTransportes(), mostrarContenedores()]).catch(showApiError);
</script>
<script src="/sidebar.js"></script>

</body>
</html>
