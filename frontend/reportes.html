<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes | MiTransporte IA</title>
<link rel="stylesheet" href="/sidebar.css">
<style>
body{font-family:Arial,sans-serif}
h1{margin:0 0 7px;color:#17213d;font-size:28px}.subtitle{margin:0 0 26px;color:#7d89a8}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{padding:22px;border:1px solid #e8ecf5;border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(25,42,80,.04)}
.panel h2{margin:0 0 18px;font-size:17px}.metric-row{display:flex;gap:12px;margin-bottom:18px}
.metric{flex:1;padding:13px;border-radius:8px;background:#f5f7fb}.metric span{display:block;color:#7d89a8;font-size:11px}.metric strong{display:block;margin-top:6px;color:#17213d;font-size:21px}
.bar-row{display:grid;grid-template-columns:115px 1fr 40px;align-items:center;gap:10px;margin:12px 0;color:#566383;font-size:12px}.bar{height:9px;overflow:hidden;border-radius:8px;background:#edf1f8}.bar i{display:block;height:100%;border-radius:8px;background:#2f6df6}
.wide{grid-column:1/-1}.loading,.error{padding:25px;color:#9aa5bf;text-align:center}.error{color:#c25b68}
.filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding:18px;border:1px solid #e8ecf5;border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(25,42,80,.04)}
.filter-field{display:flex;min-width:170px;flex-direction:column;gap:6px;color:#566383;font-size:12px}.filter-field input,.filter-field select{padding:9px;border:1px solid #dfe5f0;border-radius:7px;color:#253153;background:#fff}
.filter-actions{display:flex;gap:8px;flex-wrap:wrap}.filter-actions button{padding:9px 13px;border:0;border-radius:7px;color:#fff;background:#2f6df6;cursor:pointer}.filter-actions button.secondary{color:#2f6df6;background:#edf3ff}
@media(max-width:800px){.report-grid{grid-template-columns:1fr}.wide{grid-column:auto}.bar-row{grid-template-columns:90px 1fr 30px}}
</style>
</head>
<body>
<h1>Reportes empresariales</h1>
<p class="subtitle">Indicadores operativos calculados directamente desde SQLite.</p>
<form class="filters" id="reportFilters">
  <label class="filter-field">Desde<input type="date" id="fromDate"></label>
  <label class="filter-field">Hasta<input type="date" id="toDate"></label>
  <label class="filter-field">Estado<select id="statusFilter"><option value="">Todos los estados</option><option>Borrador</option><option>Pendiente</option><option>Pagada</option><option>Vencida</option><option>Cancelada</option><option>Aprobado</option><option>En Proceso</option><option>Finalizado</option></select></label>
  <div class="filter-actions">
    <button type="submit">Aplicar filtros</button>
    <button type="button" class="secondary" id="clearFilters">Limpiar</button>
    <button type="button" class="secondary" data-export="csv">CSV</button>
    <button type="button" class="secondary" data-export="excel">Excel</button>
    <button type="button" class="secondary" data-export="pdf">PDF</button>
  </div>
</form>
<section class="report-grid">
  <div class="panel"><h2>Reporte de clientes</h2><div id="clientes" class="loading">Cargando...</div></div>
  <div class="panel"><h2>Reporte de cotizaciones</h2><div id="cotizaciones" class="loading">Cargando...</div></div>
  <div class="panel"><h2>Reporte de transportes</h2><div id="transportes" class="loading">Cargando...</div></div>
  <div class="panel"><h2>Reporte de contenedores</h2><div id="contenedores" class="loading">Cargando...</div></div>
  <div class="panel wide"><h2>Reporte de mensajes</h2><div id="mensajes" class="loading">Cargando...</div></div>
  <div class="panel wide"><h2>Reporte de facturas</h2><div id="facturas" class="loading">Cargando...</div></div>
</section>
<script src="/api.js"></script>
<script>
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (value) => new Intl.NumberFormat("es-ES", { style:"currency", currency:"USD", maximumFractionDigits:2 }).format(Number(value) || 0);
function bars(items) {
  if (!items.length) return '<div class="loading">Sin datos registrados.</div>';
  const max = Math.max(...items.map((item) => Number(item.value)));
  return items.map((item) => `<div class="bar-row"><span>${escapeHtml(item.label)}</span><div class="bar"><i style="width:${max ? Number(item.value) / max * 100 : 0}%"></i></div><strong>${item.value}</strong></div>`).join("");
}
function metrics(items) {
  return `<div class="metric-row">${items.map((item) => `<div class="metric"><span>${escapeHtml(item.label)}</span><strong>${escapeHtml(item.value)}</strong></div>`).join("")}</div>`;
}
async function renderReports() {
  const query = new URLSearchParams();
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  const status = document.getElementById("statusFilter").value;
  if (from) query.set("from", from);
  if (to) query.set("to", to);
  if (status) query.set("status", status);
  const data = await loadReports(query.toString() ? `?${query}` : "");
  document.getElementById("clientes").innerHTML = metrics([{label:"Total registrados",value:data.clientes.total}]) + "<h3>Por provincia</h3>" + bars(data.clientes.byProvince);
  document.getElementById("cotizaciones").innerHTML = metrics([{label:"Total",value:data.cotizaciones.total},{label:"Valor total",value:money(data.cotizaciones.totalValue)},{label:"Promedio",value:money(data.cotizaciones.averageValue)}]) + "<h3>Por estado</h3>" + bars(data.cotizaciones.byStatus);
  document.getElementById("transportes").innerHTML = metrics([{label:"Total registrados",value:data.transportes.total}]) + "<h3>Por estado</h3>" + bars(data.transportes.byStatus);
  document.getElementById("contenedores").innerHTML = metrics([{label:"Total registrados",value:data.contenedores.total}]) + "<h3>Por estado</h3>" + bars(data.contenedores.byStatus);
  document.getElementById("mensajes").innerHTML = metrics([{label:"Total registrados",value:data.mensajes.total}]) + "<h3>Por canal</h3>" + bars(data.mensajes.byChannel);
  const invoiceStatus = (label) => data.facturas.byStatus.find((item) => item.label === label)?.value || 0;
  document.getElementById("facturas").innerHTML = metrics([
    {label:"Total",value:data.facturas.total},
    {label:"Borradores",value:invoiceStatus("Borrador")},
    {label:"Pendientes",value:invoiceStatus("Pendiente")},
    {label:"Pagadas",value:invoiceStatus("Pagada")},
    {label:"Vencidas",value:invoiceStatus("Vencida")},
    {label:"Canceladas",value:invoiceStatus("Cancelada")},
    {label:"Total facturado",value:money(data.facturas.totalValue)},
    {label:"Total pendiente",value:money(data.facturas.pendingValue)},
    {label:"Total pagado",value:money(data.facturas.paidValue)},
    {label:"Total vencido",value:money(data.facturas.overdueValue)}
  ]) + "<h3>Por estado</h3>" + bars(data.facturas.byStatus);
}
function filterQuery() {
  const query = new URLSearchParams();
  [["from", "fromDate"], ["to", "toDate"], ["status", "statusFilter"]].forEach(([key, id]) => {
    const value = document.getElementById(id).value;
    if (value) query.set(key, value);
  });
  return query;
}
document.getElementById("reportFilters").addEventListener("submit", (event) => {
  event.preventDefault();
  renderReports().catch(showApiError);
});
document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("reportFilters").reset();
  renderReports().catch(showApiError);
});
document.querySelectorAll("[data-export]").forEach((button) => {
  button.addEventListener("click", () => {
    const query = filterQuery();
    query.set("format", button.dataset.export);
    window.location.href = `/reports/export?${query}`;
  });
});
renderReports().catch((error) => { console.error(error); document.querySelectorAll(".loading").forEach((node) => { node.className = "error"; node.textContent = "No se pudo cargar el reporte."; }); });
</script>
<script src="/sidebar.js"></script>
</body>
</html>
