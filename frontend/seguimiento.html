<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento | MiTransporte IA</title>
<link rel="stylesheet" href="/sidebar.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f6fa;padding:20px}.card{padding:20px;margin-bottom:20px;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}select{width:100%;padding:10px;margin:10px 0 15px}button{padding:10px 16px;border:0;border-radius:6px;color:#fff;background:#0c63e7;cursor:pointer}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}.step{padding:16px 8px;border-radius:8px;color:#7d89a8;background:#f1f3f8;text-align:center;font-size:12px}.step.done{color:#fff;background:#2caa72}.step.current{color:#fff;background:#2f6df6}.timeline{margin-top:20px}.event{padding:12px 0;border-bottom:1px solid #eef1f7}.event strong{display:block}.event small{color:#8b96ae}.audit{margin-top:20px;padding-top:16px;border-top:1px solid #e8ecf5}.audit h2{font-size:17px}.audit-row{padding:10px 0;border-bottom:1px solid #eef1f7}.audit-row strong{color:#253153}.audit-row small{display:block;margin-top:4px;color:#8b96ae}@media(max-width:800px){.steps{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>Trazabilidad del servicio</h1>
<div class="card"><label>Transporte</label><select id="transport"></select><div id="summary" class="muted">Seleccione un transporte para ver el flujo completo.</div><div id="steps" class="steps"></div><div id="timeline" class="timeline"></div><div class="audit"><h2>Auditoría completa del registro</h2><div id="auditLog" class="muted">Seleccione un transporte para consultar la auditoría.</div></div></div>
<script src="/api.js"></script>
<script>
const esc=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stages=["Cliente","Cotización","Aprobación","Transporte","Contenedor","Factura","Servicio Finalizado"];
async function loadTransportOptions(){const items=await loadRecords("transportes");const select=document.getElementById("transport");select.innerHTML='<option value="">Seleccione un transporte</option>'+items.map(t=>`<option value="${t.id}">#${t.id} · ${esc(t.cliente)} · ${esc(t.origen)} → ${esc(t.destino)}</option>`).join("");const selected=new URLSearchParams(location.search).get("transporte");if(selected){select.value=selected;renderTrace(selected)}select.addEventListener("change",()=>select.value&&renderTrace(select.value))}
async function renderTrace(id){const data=await fetch(`/trazabilidad/transportes/${id}`).then(async r=>{if(!r.ok)throw new Error((await r.json()).error||"No se pudo cargar la trazabilidad");return r.json()});const paid=data.facturas.some(f=>f.estado==="Pagada");const finished=data.transporte.estado==="Finalizado"&&data.contenedores.some(c=>c.estado==="Finalizado");const done=[true,Boolean(data.cotizacion),Boolean(data.cotizacion&&data.cotizacion.estado==="Aprobado"),true,data.contenedores.length>0,data.facturas.length>0,paid&&finished];document.getElementById("summary").innerHTML=`Cliente: <strong>${esc(data.cliente.nombre)}</strong> · Estado: <strong>${esc(data.transporte.estado)}</strong>`;document.getElementById("steps").innerHTML=stages.map((s,i)=>`<div class="step ${done[i]?"done":""}">${s}<br>${done[i]?"Completado":"Pendiente"}</div>`).join("");document.getElementById("timeline").innerHTML=data.historial.length?data.historial.map(h=>`<div class="event"><strong>${esc(h.modulo)} #${esc(h.registro_id)}: ${esc(h.estado_anterior||"Inicio")} → ${esc(h.estado_nuevo)}</strong><small>${esc(h.usuario||"Sistema")} · ${esc(h.created_at)}</small></div>`).join(""):"Sin historial registrado.";document.getElementById("auditLog").innerHTML=data.auditoria?.length?data.auditoria.map(a=>`<div class="audit-row"><strong>${esc(a.modulo)} #${esc(a.registro_id)} · ${esc(a.accion)}</strong><small>${esc(a.detalles)} · ${esc(a.usuario||"Sistema")} · ${esc(a.created_at)}</small></div>`).join(""):"Sin auditoría registrada."}
loadTransportOptions().catch(showApiError);
</script>
<script src="/sidebar.js"></script>
</body>
</html>
