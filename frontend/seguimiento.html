<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento | MiTransporte IA</title>
<link rel="stylesheet" href="/sidebar.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f6fa;padding:20px}.card{padding:20px;margin-bottom:20px;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}select,input{width:100%;padding:10px;margin:10px 0 15px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:6px;color:#fff;background:#0c63e7;cursor:pointer}.trace-form{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:12px}.trace-form label{font-size:12px;color:#566383}.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-top:22px}.step{padding:16px 8px;border-radius:8px;color:#7d89a8;background:#f1f3f8;text-align:center;font-size:12px}.step.done{color:#fff;background:#2caa72}.step.current{color:#fff;background:#2f6df6}.timeline{margin-top:20px}.event{padding:12px 0;border-bottom:1px solid #eef1f7}.event strong{display:block}.event small{color:#8b96ae}.audit{margin-top:20px;padding-top:16px;border-top:1px solid #e8ecf5}.audit h2{font-size:17px}.audit-row{padding:10px 0;border-bottom:1px solid #eef1f7}.audit-row strong{color:#253153}.audit-row small{display:block;margin-top:4px;color:#8b96ae}@media(max-width:900px){.steps{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.trace-form{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>Trazabilidad del servicio</h1>
<div class="card"><div class="trace-form"><label>Transporte<select id="transport"></select></label><label>Consultar desde cualquier módulo<select id="resource"><option value="clientes">Cliente</option><option value="cotizaciones">Cotización</option><option value="transportes">Transporte</option><option value="contenedores">Contenedor</option><option value="facturas">Factura</option></select></label><label>ID del registro<input id="resourceId" type="number" min="1" placeholder="Ej. 1"></label><button id="lookup" type="button">Consultar</button></div><div id="summary" class="muted">Seleccione un transporte o consulte cualquier registro relacionado.</div><div id="steps" class="steps"></div><div id="timeline" class="timeline"></div><div class="audit"><h2>Auditoría completa del registro</h2><div id="auditLog" class="muted">La auditoría aparecerá junto con la línea temporal.</div></div></div>
<script src="/api.js"></script>
<script>
const esc=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stages=["Cliente","Cotización","Aprobación","Transporte","Contenedor","Factura","Cobro","Servicio Finalizado"];
async function loadTransportOptions(){const items=await loadRecords("transportes");const select=document.getElementById("transport");select.innerHTML='<option value="">Seleccione un transporte</option>'+items.map(t=>`<option value="${t.id}">#${t.id} · ${esc(t.cliente)} · ${esc(t.origen)} → ${esc(t.destino)}</option>`).join("");const params=new URLSearchParams(location.search);const selected=params.get("transporte");const resource=params.get("modulo");const resourceId=params.get("id");if(resource&&resourceId){document.getElementById("resource").value=resource;document.getElementById("resourceId").value=resourceId;renderTrace(resource,resourceId)}else if(selected){select.value=selected;renderTrace("transportes",selected)}select.addEventListener("change",()=>select.value&&renderTrace("transportes",select.value))}
async function renderTrace(resource,id){const data=await fetch(`/trazabilidad/${resource}/${id}`).then(async r=>{if(!r.ok)throw new Error((await r.json()).error||"No se pudo cargar la trazabilidad");return r.json()});const paid=data.facturas?.some(f=>f.estado==="Pagada");const finished=data.transporte?.estado==="Finalizado"&&data.contenedores?.some(c=>c.estado==="Finalizado");const done=[Boolean(data.cliente),Boolean(data.cotizacion),Boolean(data.cotizacion&&data.cotizacion.estado==="Aprobado"),Boolean(data.transporte),Boolean(data.contenedores?.length),Boolean(data.facturas?.length),Boolean(paid),Boolean(paid&&finished)];document.getElementById("summary").innerHTML=`Origen: <strong>${esc(data.recurso_origen)} #${esc(data.registro_origen)}</strong> · Cliente: <strong>${esc(data.cliente?.nombre||"Pendiente")}</strong> · Estado: <strong>${esc(data.transporte?.estado||data.cotizacion?.estado||"Pendiente")}</strong>`;document.getElementById("steps").innerHTML=stages.map((s,i)=>`<div class="step ${done[i]?"done":""}">${s}<br>${done[i]?"Completado":"Pendiente"}</div>`).join("");document.getElementById("timeline").innerHTML=data.timeline?.length?data.timeline.map(h=>`<div class="event"><strong>${esc(h.evento)} · ${esc(h.modulo)} #${esc(h.registro_id)}</strong><small>${esc(h.estado_anterior?`${h.estado_anterior} → ${h.estado_nuevo}`:h.detalles||"Registro creado")} · ${esc(h.usuario||"Sistema")} · ${esc(h.created_at)}</small></div>`).join(""):"Sin historial registrado.";document.getElementById("auditLog").innerHTML=data.auditoria?.length?data.auditoria.map(a=>`<div class="audit-row"><strong>${esc(a.modulo)} #${esc(a.registro_id)} · ${esc(a.accion)}</strong><small>${esc(a.detalles)} · ${esc(a.usuario||"Sistema")} · ${esc(a.created_at)}</small></div>`).join(""):"Sin auditoría registrada."}
document.getElementById("lookup").addEventListener("click",()=>{const id=document.getElementById("resourceId").value;if(id)renderTrace(document.getElementById("resource").value,id).catch(showApiError)});
loadTransportOptions().catch(showApiError);
</script>
<script src="/sidebar.js"></script>
</body>
</html>
