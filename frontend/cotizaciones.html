<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotizaciones | MiTransporte IA</title>
<link rel="stylesheet" href="/sidebar.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f6fa;
padding:20px;
}

h1{
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
}

input,
select,
textarea{
width:100%;
padding:10px;
margin-bottom:15px;
}

button{
background:#0c63e7;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#094eb4;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0c63e7;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

.estado{
font-weight:bold;
}

</style>

</head>

<body>

<h1>💰 Gestión de Cotizaciones</h1>

<div class="card">

<h2>Nueva Cotización</h2>

<label>Cliente</label>
<select id="cliente_id" required>
<option value="">Cargando clientes...</option>
</select>

<label>Teléfono</label>
<input type="text" id="telefono">

<label>Origen</label>
<input type="text" id="origen">

<label>Destino</label>
<input type="text" id="destino">

<label>Servicio</label>

<select id="servicio">

<option>Transporte de Carga</option>
<option>Contenedor 20</option>
<option>Contenedor 40</option>
<option>Moto</option>
<option>Moto Eléctrica</option>
<option>Triciclo</option>

</select>

<label>Importe</label>
<input type="number" id="importe">

<label>Estado</label>

<select id="estado">

<option>Pendiente</option>
<option>Aprobado</option>
<option>En Proceso</option>
<option>Finalizado</option>

</select>

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<button onclick="guardarCotizacion()">
Guardar Cotización
</button>

</div>

<div class="card">

<h2>Cotizaciones Registradas</h2>

<table>

<thead>

<tr>
<th>ID</th>
<th>Cliente</th>
<th>Servicio</th>
<th>Importe</th>
<th>Estado</th>
<th>Trazabilidad</th>
</tr>

</thead>

<tbody id="tablaCotizaciones">

</tbody>

</table>

</div>

<script src="/api.js"></script>
<script>
async function cargarClientes() {
  const clientes = await loadRecords("clientes");
  const select = document.getElementById("cliente_id");
  select.innerHTML = '<option value="" selected disabled>Seleccione un cliente</option>' +
    clientes.map((cliente) => `<option value="${cliente.id}" data-telefono="${escapeHtml(cliente.telefono)}">${escapeHtml(cliente.nombre)}</option>`).join("");
  select.addEventListener("change", () => {
    const option = select.options[select.selectedIndex];
    document.getElementById("telefono").value = option.dataset.telefono || "";
  });
}

async function mostrarCotizaciones() {
  const tabla = document.getElementById("tablaCotizaciones");
  const cotizaciones = await loadRecords("cotizaciones");
  tabla.innerHTML = cotizaciones.map((c) => `
    <tr><td>${c.id}</td><td>${escapeHtml(c.cliente)}</td><td>${escapeHtml(c.servicio)}</td><td>$${escapeHtml(c.importe)}</td><td>${escapeHtml(c.estado)}</td><td><a href="/seguimiento-app?modulo=cotizaciones&id=${c.id}">Ver expediente</a></td></tr>
  `).join("");
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

async function guardarCotizacion() {
  const record = {
    cliente_id: document.getElementById("cliente_id").value,
    telefono: document.getElementById("telefono").value,
    origen: document.getElementById("origen").value,
    destino: document.getElementById("destino").value,
    servicio: document.getElementById("servicio").value,
    importe: document.getElementById("importe").value,
    estado: document.getElementById("estado").value,
    observaciones: document.getElementById("observaciones").value
  };
  if (record.cliente_id === "") {
    alert("Debe seleccionar el cliente");
    return;
  }
  try {
    await saveRecord("cotizaciones", record);
    await mostrarCotizaciones();
    document.getElementById("cliente_id").value = "";
    ["telefono", "origen", "destino", "importe", "observaciones"]
      .forEach((id) => document.getElementById(id).value = "");
  } catch (error) {
    showApiError(error);
  }
}

Promise.all([cargarClientes(), mostrarCotizaciones()]).catch(showApiError);
</script>
<script src="/sidebar.js"></script>

</body>
</html>
