<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes</title>
<link rel="stylesheet" href="/sidebar.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f6fa;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input, textarea, select{
width:100%;
padding:10px;
margin-bottom:15px;
}

button{
background:#0c63e7;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0c63e7;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>Mensajes</h1>

<div class="card">

<h2>Nuevo Mensaje</h2>

<label>Canal</label>

<select id="canal">
<option>WhatsApp</option>
<option>Facebook</option>
<option>Instagram</option>
<option>Telegram</option>
<option>Correo</option>
</select>

<label>Cliente</label>
<input type="text" id="cliente">

<label>Mensaje</label>
<textarea id="mensaje"></textarea>

<button onclick="guardarMensaje()">
Guardar Mensaje
</button>

</div>

<div class="card">

<h2>Mensajes Registrados</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Canal</th>
<th>Cliente</th>
<th>Mensaje</th>
</tr>
</thead>

<tbody id="tablaMensajes">

</tbody>

</table>

</div>

<script src="/api.js"></script>
<script>
async function mostrarMensajes() {
  const tabla = document.getElementById("tablaMensajes");
  const mensajes = await loadRecords("mensajes");
  tabla.innerHTML = mensajes.map((m) => `
    <tr><td>${m.id}</td><td>${m.canal}</td><td>${m.cliente}</td><td>${m.mensaje}</td></tr>
  `).join("");
}

async function guardarMensaje() {
  const record = {
    canal: document.getElementById("canal").value,
    cliente: document.getElementById("cliente").value,
    mensaje: document.getElementById("mensaje").value
  };
  if (record.cliente === "") {
    alert("Debe indicar el cliente");
    return;
  }
  try {
    await saveRecord("mensajes", record);
    await mostrarMensajes();
    ["cliente", "mensaje"].forEach((id) => document.getElementById(id).value = "");
  } catch (error) {
    showApiError(error);
  }
}

mostrarMensajes().catch(showApiError);
</script>
<script src="/sidebar.js"></script>

</body>

</html>
