<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiTransporte IA</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6fa;
display:flex;
}

.sidebar{
width:250px;
background:#0c63e7;
height:100vh;
padding:20px;
box-sizing:border-box;
}

.sidebar h2{
color:white;
margin-top:0;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
margin-bottom:10px;
}

.sidebar a{
display:block;
padding:12px;
background:rgba(255,255,255,0.1);
border-radius:8px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.content{
flex:1;
padding:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.numero{
font-size:36px;
font-weight:bold;
color:#0c63e7;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>MiTransporte IA</h2>

<ul>

<li>
<a href="/dashboard">
🏠 Dashboard
</a>
</li>

<li>
<a href="/transportes-app">
🚚 Transportes
</a>
</li>

<li>
<a href="#">
👥 Clientes
</a>
</li>

<li>
<a href="#">
📦 Contenedores
</a>
</li>

<li>
<a href="#">
💰 Cotizaciones
</a>
</li>

<li>
<a href="#">
💬 Mensajes
</a>
</li>

<li>
<a href="#">
📊 Reportes
</a>
</li>

<li>
<a href="#">
⚙ Configuración
</a>
</li>

</ul>

</div>

<div class="content">

<h1>Panel Principal</h1>

<div class="cards">

<div class="card">
<h3>Transportes</h3>
<div class="numero">1</div>
</div>

<div class="card">
<h3>Clientes</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Contenedores</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Cotizaciones</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Mensajes</h3>
<div class="numero">2</div>
</div>

</div>

</div>

</body>
</html>
