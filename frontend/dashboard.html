<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiTransporte IA</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f6f9;
margin:0;
padding:0;
}

header{
background:#0c63e7;
color:white;
padding:20px;
text-align:center;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
margin-top:0;
color:#0c63e7;
}

.numero{
font-size:36px;
font-weight:bold;
}

</style>

</head>

<body>

<header>
<h1>MiTransporte IA</h1>
<p>Centro de Gestión Empresarial</p>
</header>

<div class="container">

<div class="card">
<h2>Transportes</h2>
<div class="numero">1</div>
</div>

<div class="card">
<h2>Clientes</h2>
<div class="numero">2</div>
</div>

<div class="card">
<h2>Contenedores</h2>
<div class="numero">2</div>
</div>

<div class="card">
<h2>Cotizaciones</h2>
<div class="numero">2</div>
</div>

<div class="card">
<h2>Mensajes</h2>
<div class="numero">2</div>
</div>

</div>

</body>

</html>
