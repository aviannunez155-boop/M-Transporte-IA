<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiTransporte IA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f6f9;
}

.sidebar{
width:250px;
background:#0c63e7;
height:100vh;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:20px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:12px;
margin-bottom:8px;
background:rgba(255,255,255,.1);
border-radius:8px;
}

.sidebar a{
color:white;
text-decoration:none;
display:block;
}

.content{
flex:1;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
color:#0c63e7;
margin-bottom:10px;
}

.numero{
font-size:38px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>MiTransporte IA</h2>

<ul>

<li>
<a href="/dashboard">
🏠 Dashboard
</a>
</li>

<li>

🚚 Transportes
</a>
</li>

<li>
<a href="/contenedores">
📦 Contenedores
</a>
</li>

<li>
<a href="/clientes">
👥 Clientes
</a>
</li>

<li>
<a href="/cotizaciones">
💰 Cotizaciones
</a>
</li>

<li>
<a href="/mensajes">
💬 Mensajes
</a>
</li>

<li>
<a href="#">
📊 Reportes
</a>
</li>

<li>
<a href="#">
⚙ Configuración
</a>
</li>

</ul>

</div>

<div class="content">

<div class="header">

<h1>Centro de Gestión Empresarial</h1>

<p>Panel principal de operaciones</p>

</div>

<div class="container">

<div class="card">
<h3>Transportes</h3>
<div class="numero">1</div>
</div>

</div>

</div>

</div>
