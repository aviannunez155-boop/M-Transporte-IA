<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiTransporte IA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
display:flex;
background:#f5f6fa;
}

.sidebar{
width:250px;
height:100vh;
background:#0c63e7;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:20px;
}

.menu{
list-style:none;
}

.menu li{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,0.1);
border-radius:8px;
}

.content{
flex:1;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card h3{
margin-bottom:10px;
color:#0c63e7;
}

.numero{
font-size:32px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>MiTransporte IA</h2>

<ul class="menu">

<li>🏠 Dashboard</li>

<li>🚚 Transportes</li>

<li>👥 Clientes</li>

<li>📦 Contenedores</li>

<li>💰 Cotizaciones</li>

<li>💬 Mensajes</li>

<li>📊 Reportes</li>

<li>⚙ Configuración</li>

</ul>

</div>

<div class="content">

<div class="header">

<h1>Panel Principal</h1>

<p>Centro de Gestión Empresarial</p>

</div>

<div class="cards">

<div class="card">
<h3>Transportes</h3>
<div class="numero">1</div>
</div>

<div class="card">
<h3>Clientes</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Contenedores</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Cotizaciones</h3>
<div class="numero">2</div>
</div>

<div class="card">
<h3>Mensajes</h3>
<div class="numero">2</div>
</div>

</div>

</div>

</body>

</html>
